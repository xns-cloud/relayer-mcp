# relayer-mcp CI — test on MRs/main, publish to npm AND the official MCP
# Registry on version tags.
#
# Ongoing release model: the ONLY publish trigger is a human pushing a vX.Y.Z
# tag (agents never tag, never publish — see GitLab MR Boundaries). The tag
# must match package.json's version, which lands via normal MR review.
# One tag ships both registries; there is no manual follow-up step.
#
# Publishing uses npm TRUSTED PUBLISHING (OIDC) — no npm token exists anywhere,
# nothing expires, nothing rotates. GitLab mints a short-lived id_token per job
# and npm verifies it against the trusted publisher configured on the package.
#
# One-time setup (runbook: relayer-mcp-support/PUBLISHING.md):
#   1. npmjs.com → @xns-cloud/relayer-mcp → Settings → Trusted publisher →
#      GitLab CI/CD: namespace `scpcorp`, project `relayer-mcp`,
#      CI file path `.gitlab-ci.yml`, allowed action `npm publish`.
#   2. GitLab → Settings → Repository → Protected tags: protect `v*`
#      (governance: only maintainers can trigger a release).
#   3. GitLab → Settings → CI/CD → Variables: add `MCP_REGISTRY_KEY`
#      (Masked + Protected). See PUBLISHING.md for how to derive its value.
# Requires GitLab.com shared runners (self-hosted runners not yet supported
# by npm trusted publishing).
#
# The MCP Registry has no OIDC path for domain namespaces — `tech.xns` is a
# reverse-DNS name, so it authenticates by signing a challenge with the private
# key whose public half is served at https://xns.tech/.well-known/mcp-registry-auth.
# That is why this one job needs a stored secret and the npm job does not.

stages:
  - test
  - bundle
  - publish
  - registry
  - release

test:
  stage: test
  image: node:20   # engines floor — the suite must pass on the oldest supported Node
  script:
    - npm ci
    - npm test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# Builds the MCPB desktop-extension bundle and proves it actually runs.
#
# This job sits BEFORE publish on purpose. `npm publish` is irreversible; a
# broken bundle discovered afterwards leaves a shipped npm version whose
# packaging path does not work. Failing here costs a red pipeline and nothing
# else.
#
# It is also the only thing that executes `npm run bundle`. That script shipped
# broken once — it called a bare `mcpb` that was in neither dependencies nor
# devDependencies — and nobody noticed, because the bundle was always built by
# hand. Running it every release turns that class of defect into a build
# failure instead of a review catch.
bundle:
  stage: bundle
  image: node:20
  needs: [test]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    # manifest.json is a fourth copy of the version (package.json, server.json
    # and package-lock.json are the others). A unit test pins them to each other;
    # this re-checks against the TAG so the job stands alone when retried.
    - MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
    - |
      if [ "v${MANIFEST_VERSION}" != "${CI_COMMIT_TAG}" ]; then
        echo "Tag ${CI_COMMIT_TAG} does not match manifest.json version ${MANIFEST_VERSION} — aborting."
        exit 1
      fi
    # npm run bundle reinstalls production-only deps, validates, and packs. The
    # MCPB CLI version is pinned inside that script — do not inline an
    # unversioned npx here, or the artifact stops matching what was validated.
    # `mcpb pack` names its output after the working directory, which is not
    # stable across runners, so rename it explicitly.
    - npm run bundle
    - mv ./*.mcpb "relayer-mcp-${CI_COMMIT_TAG}.mcpb"
    # Prove the packed bundle starts and speaks MCP. A bundle that validates but
    # cannot answer initialize is worse than no bundle — it would fail in a
    # reviewer's Claude Desktop instead of here.
    - mkdir -p bundle-check && cd bundle-check && unzip -q "../relayer-mcp-${CI_COMMIT_TAG}.mcpb"
    - |
      printf '%s\n%s\n' \
        '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
        '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
        | node src/index.js > ../bundle-check.jsonl
    - cd ..
    - |
      node -e '
        const lines = require("fs").readFileSync("bundle-check.jsonl","utf8").trim().split("\n");
        const tools = JSON.parse(lines[lines.length - 1]).result.tools;
        const expected = require("./manifest.json").tools.length;
        if (tools.length !== expected) {
          console.error("Bundle answered with " + tools.length + " tools, manifest declares " + expected + " — aborting.");
          process.exit(1);
        }
        const bad = tools.filter((t) => !t.title || !t.annotations);
        if (bad.length) {
          console.error("Tools missing title or annotations (directory review rejects these): " + bad.map((t) => t.name).join(", "));
          process.exit(1);
        }
        console.log("Bundle smoke test passed: " + tools.length + " tools, all annotated.");
      '
  artifacts:
    name: "relayer-mcp-${CI_COMMIT_TAG}-mcpb"
    paths:
      - "relayer-mcp-*.mcpb"
    expire_in: never

publish:
  stage: publish
  image: node:24   # trusted publishing needs npm >= 11.5.1 / Node >= 22.14
  needs: [test]
  id_tokens:
    NPM_ID_TOKEN:
      aud: "npm:registry.npmjs.org"
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - node --version && npm --version
    # The tag is the release request; package.json is the release content.
    # Refuse to publish a mismatch instead of silently shipping the wrong code.
    - PKG_VERSION=$(node -p "require('./package.json').version")
    - |
      if [ "v${PKG_VERSION}" != "${CI_COMMIT_TAG}" ]; then
        echo "Tag ${CI_COMMIT_TAG} does not match package.json version ${PKG_VERSION} — aborting."
        exit 1
      fi
    - npm ci
    # prepublishOnly reruns the test suite as a last gate before the tarball ships.
    # No token, no .npmrc — npm exchanges NPM_ID_TOKEN with the registry (OIDC).
    - npm publish

# Publishes the server.json manifest to registry.modelcontextprotocol.io, which is
# what MCP clients and directory aggregators read. Runs AFTER npm: the manifest
# advertises an npm version, so that version must already exist on npm.
# A failure here leaves npm correct and the registry one release behind — visible
# as a red pipeline, recoverable by re-running this job alone.
mcp-registry:
  stage: registry
  image: node:24
  needs: [publish]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    # server.json carries its own version and must agree with the tag. A unit test
    # already pins server.json to package.json; this keeps the job self-contained
    # when it is retried on its own.
    - SRV_VERSION=$(node -p "require('./server.json').version")
    - |
      if [ "v${SRV_VERSION}" != "${CI_COMMIT_TAG}" ]; then
        echo "Tag ${CI_COMMIT_TAG} does not match server.json version ${SRV_VERSION} — aborting."
        exit 1
      fi
    - |
      if [ -z "${MCP_REGISTRY_KEY}" ]; then
        echo "MCP_REGISTRY_KEY is not set — see PUBLISHING.md. Aborting."
        exit 1
      fi
    # Pinned by version AND by content digest, then verified before anything is
    # extracted or run. A version tag alone is not a guarantee — GitHub release
    # assets can be replaced in place, and this binary is executed in a job where
    # MCP_REGISTRY_KEY is in scope. Bumping the CLI means changing both values.
    # Bounded: a stalled download at release time should fail in minutes with a
    # clear cause, not hang until the job timeout. Retries cover transient GitHub
    # blips; the checksum below is what covers the bytes.
    - curl -fsSL --connect-timeout 10 --max-time 120 --retry 3 --retry-delay 5 --retry-connrefused -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
    - echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
    - tar xzf mcp-publisher.tar.gz mcp-publisher
    # Domain proof: the CLI signs a challenge with MCP_REGISTRY_KEY; the registry
    # verifies it against the public key served at the .well-known URL on xns.tech.
    - ./mcp-publisher login http --domain=xns.tech --private-key="${MCP_REGISTRY_KEY}"
    - ./mcp-publisher publish
  variables:
    MCP_PUBLISHER_VERSION: "1.8.1"
    # sha256 of mcp-publisher_linux_amd64.tar.gz at the version above.
    MCP_PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"

# Attaches the .mcpb to a GitLab release so there is one canonical, tag-pinned
# artifact to submit and to link from docs. Without it the bundle exists only on
# whichever laptop last ran `npm run bundle` — which is how you end up
# submitting a build nobody can reproduce.
#
# Runs last: a release should not appear for a version that failed to reach npm
# or the MCP Registry.
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: [bundle, publish, mcp-registry]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - echo "Creating release ${CI_COMMIT_TAG} with the MCPB bundle attached."
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "$CI_COMMIT_TAG"
    description: "MCPB desktop-extension bundle for ${CI_COMMIT_TAG}. Install it in Claude Desktop; see CHANGELOG.md for what changed. npm: @xns-cloud/relayer-mcp@${CI_COMMIT_TAG}"
    assets:
      links:
        - name: "relayer-mcp-${CI_COMMIT_TAG}.mcpb"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/relayer-mcp-${CI_COMMIT_TAG}.mcpb?job=bundle"
          link_type: package
