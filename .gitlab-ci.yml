# relayer-mcp CI — test on MRs/main, publish to npm on version tags.
#
# Ongoing release model: the ONLY publish trigger is a human pushing a vX.Y.Z
# tag (agents never tag, never publish — see GitLab MR Boundaries). The tag
# must match package.json's version, which lands via normal MR review.
#
# Publishing uses npm TRUSTED PUBLISHING (OIDC) — no npm token exists anywhere,
# nothing expires, nothing rotates. GitLab mints a short-lived id_token per job
# and npm verifies it against the trusted publisher configured on the package.
#
# One-time setup (runbook: relayer-mcp-support/PUBLISHING.md):
#   1. npmjs.com → @xns-cloud/relayer-mcp → Settings → Trusted publisher →
#      GitLab CI/CD: namespace `scpcorp`, project `relayer-mcp`,
#      CI file path `.gitlab-ci.yml`, allowed action `npm publish`.
#   2. GitLab → Settings → Repository → Protected tags: protect `v*`
#      (governance: only maintainers can trigger a release).
# Requires GitLab.com shared runners (self-hosted runners not yet supported
# by npm trusted publishing).

stages:
  - test
  - publish

test:
  stage: test
  image: node:20   # engines floor — the suite must pass on the oldest supported Node
  script:
    - npm ci
    - npm test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

publish:
  stage: publish
  image: node:24   # trusted publishing needs npm >= 11.5.1 / Node >= 22.14
  needs: [test]
  id_tokens:
    NPM_ID_TOKEN:
      aud: "npm:registry.npmjs.org"
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - node --version && npm --version
    # The tag is the release request; package.json is the release content.
    # Refuse to publish a mismatch instead of silently shipping the wrong code.
    - PKG_VERSION=$(node -p "require('./package.json').version")
    - |
      if [ "v${PKG_VERSION}" != "${CI_COMMIT_TAG}" ]; then
        echo "Tag ${CI_COMMIT_TAG} does not match package.json version ${PKG_VERSION} — aborting."
        exit 1
      fi
    - npm ci
    # prepublishOnly reruns the test suite as a last gate before the tarball ships.
    # No token, no .npmrc — npm exchanges NPM_ID_TOKEN with the registry (OIDC).
    - npm publish
